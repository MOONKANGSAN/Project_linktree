# Docker 환경 전용 설정 (docker-compose에서 SPRING_PROFILES_ACTIVE=docker 로 활성화)

# MySQL 드라이버
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - MySQL 방언 및 DDL 전략
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# H2 콘솔 비활성화 (운영 환경)
spring.h2.console.enabled=false

# 파일 업로드 크기 제한 (Docker 환경에서 명시적으로 지정)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ── CORS 허용 Origin (운영 배포용) ────────────────────────────
# docker-compose.prod.yml에서 CORS_ALLOWED_ORIGINS 환경변수로 주입
# 미설정 시 SecurityConfig의 기본값(http://localhost:5173) 사용
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

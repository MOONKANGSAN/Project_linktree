spring.application.name=linktree

# 파일 업로드 저장 경로 (Docker 환경에서는 환경변수로 덮어씀)
app.upload.dir=${UPLOAD_DIR:./uploads}

# 멀티파트 파일 업로드 크기 제한
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# H2 인메모리 DB (기본값 - 로컬 개발용, Docker 환경에서는 application-docker.properties가 덮어씀)
spring.datasource.url=${DB_URL:jdbc:h2:mem:linktreedb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA 공통 설정
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=true

# H2 콘솔 (로컬 개발용: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

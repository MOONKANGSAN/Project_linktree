services:

  # ── MySQL 데이터베이스 ────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: linktree-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${DB_NAME:-linktreedb}
      MYSQL_USER: ${DB_USER:-linktree}
      MYSQL_PASSWORD: ${DB_PASSWORD:-linktree1234}
    ports:
      # .env의 MYSQL_PORT 값으로 변경 가능 (기본 3307 → project2와 충돌 방지)
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      # 프로젝트 고유 이름 사용 → 다른 프로젝트 볼륨과 충돌 방지
      - linktree-mysql-data:/var/lib/mysql
    networks:
      - linktree-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root1234}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── React 프론트엔드 (Nginx 서빙 + API 프록시) ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: linktree-frontend
    ports:
      # .env의 FRONTEND_PORT 값으로 변경 가능 (기본 3000 → 80 대신 사용)
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - linktree-network

  # ── Spring Boot 백엔드 ────────────────────────────────────────
  backend:
    build:
      context: ./linktree
      dockerfile: Dockerfile
    container_name: linktree-backend
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-linktreedb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      DB_USERNAME: ${DB_USER:-linktree}
      DB_PASSWORD: ${DB_PASSWORD:-linktree1234}
      DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: docker
    ports:
      # .env의 BACKEND_PORT 값으로 변경 가능 (기본 8081 → 8080 충돌 방지)
      - "${BACKEND_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - linktree-network

networks:
  linktree-network:
    driver: bridge

volumes:
  # 프로젝트 고유 볼륨 이름 (project2의 mysql-data와 격리)
  linktree-mysql-data:

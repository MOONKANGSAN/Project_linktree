services:

  # ── MySQL 데이터베이스 ────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: linktree-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${DB_NAME:-linktreedb}
      MYSQL_USER: ${DB_USER:-linktree}
      MYSQL_PASSWORD: ${DB_PASSWORD:-linktree1234}
    ports:
      # .env의 MYSQL_PORT 값으로 변경 가능 (기본 3307 → project2와 충돌 방지)
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      # 프로젝트 고유 이름 사용 → 다른 프로젝트 볼륨과 충돌 방지
      - linktree-mysql-data:/var/lib/mysql
    networks:
      - linktree-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root1234}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── React 프론트엔드 (개발: Vite dev 서버 + HMR) ─────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # dev 스테이지 사용 → Vite 개발 서버로 실행 (watch와 함께 사용)
      target: dev
    container_name: linktree-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - linktree-network
    develop:
      watch:
        # src 변경 → 컨테이너 내부로 파일 동기화 (Vite HMR이 자동 감지)
        - path: ./frontend/src
          action: sync
          target: /app/src
        # index.html 변경 → 동기화
        - path: ./frontend/index.html
          action: sync
          target: /app/index.html
        # vite 설정 변경 → 개발 서버 재시작
        - path: ./frontend/vite.config.ts
          action: sync+restart
          target: /app/vite.config.ts
        # 패키지 추가/삭제 → npm install 재실행을 위해 이미지 재빌드
        - path: ./frontend/package.json
          action: rebuild

  # ── Spring Boot 백엔드 ────────────────────────────────────────
  backend:
    build:
      context: ./linktree
      dockerfile: Dockerfile
    container_name: linktree-backend
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-linktreedb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      DB_USERNAME: ${DB_USER:-linktree}
      DB_PASSWORD: ${DB_PASSWORD:-linktree1234}
      DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: docker
      # 절대 경로로 지정 — 상대 경로는 Tomcat 임시 디렉터리 기준으로 해석되어 FileNotFoundException 유발
      UPLOAD_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 업로드 파일 영속화 — 컨테이너 재시작 시 파일 유지
      - linktree-uploads:/app/uploads
    networks:
      - linktree-network
    develop:
      watch:
        # Java 소스 변경 → Gradle 재빌드 + 컨테이너 재시작 (컴파일 필요)
        - path: ./linktree/src
          action: rebuild
        # 의존성 변경 → 전체 재빌드
        - path: ./linktree/build.gradle
          action: rebuild

networks:
  linktree-network:
    driver: bridge

volumes:
  # 프로젝트 고유 볼륨 이름 (project2의 mysql-data와 격리)
  linktree-mysql-data:
  linktree-uploads:

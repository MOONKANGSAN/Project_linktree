# HTTP: Let's Encrypt 인증 파일 응답 + 그 외 요청은 HTTPS로 리다이렉트
server {
    listen 80;
    server_name ${DOMAIN};

    # 인증서 발급/갱신 시 Let's Encrypt가 이 경로로 검증 파일을 요청함
    # (certbot 컨테이너가 같은 경로에 파일을 써주는 공유 볼륨)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 요청은 HTTPS로 강제 이동
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: 기존 SPA 서빙 + /api 프록시 (여기로 옮겨옴)
server {
    listen 443 ssl;
    server_name ${DOMAIN};

    # init-letsencrypt.sh 실행 후 certbot이 이 경로에 인증서를 채워넣음
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    # 오래된 취약한 프로토콜(TLS 1.0/1.1) 비활성화 — 최소한의 안전장치
    ssl_protocols TLSv1.2 TLSv1.3;

    # React SPA 라우팅 (새로고침 시 404 방지)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # /api/* 요청은 Spring Boot 백엔드로 프록시
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 업로드 파일(프로필 사진 등) 응답도 백엔드로 프록시
    # (WebMvcConfig가 /uploads/**를 UPLOAD_DIR에 매핑해서 서빙함)
    # vite.config.ts의 dev 프록시에는 있었는데 운영용 nginx.conf엔 빠져있던 부분
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# docker-compose.prod.yml
# 운영 서버 배포 전용 오버라이드 (기존 docker-compose.yml의 dev 설정을 덮어씀)
# 실행: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d --build
services:

  # ── React 프론트엔드: dev 서버 대신 Nginx 운영 빌드 사용 ─────────
  frontend:
    build:
      # frontend/Dockerfile의 "AS production" 스테이지(Nginx 정적 서빙)를 사용
      target: production
    # !override: 기존 docker-compose.yml의 "5173:5173" 매핑을 지우고 아래 값으로 완전히 대체
    # (YAML 리스트는 기본적으로 병합(추가)되므로, 완전 교체하려면 !override가 필요함
    #  — !reset은 값을 아예 비워버리므로 포트를 "바꿔서" 열 때는 !override를 사용)
    # 전용 인스턴스라 project2와 포트 충돌을 피할 필요가 없어 기본값을 80으로 둠
    # (.env에 FRONTEND_PORT를 안 넣어도 표준 HTTP 포트로 뜨도록)
    # 443도 추가로 열어서 HTTPS를 직접 받음 (80은 ACME 검증 + HTTPS로 리다이렉트 용도로만 사용)
    ports: !override
      - "${FRONTEND_PORT:-80}:80"
      - "443:443"
    # Nginx 정적 서빙이라 메모리 사용량이 크지 않지만, 다른 서비스와 형평성 있게 상한만 걸어둠
    mem_limit: 48m
    environment:
      # nginx.conf가 /etc/nginx/templates/default.conf.template로 들어가 있어서
      # 컨테이너 기동 시 이 값으로 ${DOMAIN} 부분이 자동 치환됨 (Dockerfile 참고)
      DOMAIN: ${DOMAIN}
    volumes:
      # certbot이 발급한 인증서를 Nginx가 읽을 수 있도록 공유 (읽기 전용)
      - certbot-etc:/etc/letsencrypt:ro
      # Let's Encrypt의 HTTP-01 검증 파일을 Nginx가 서빙할 수 있도록 공유
      - certbot-webroot:/var/www/certbot:ro
    # develop.watch는 `docker compose watch` 명령에서만 사용되고
    # `up`/`up -d`에는 영향이 없으므로 운영 배포에서는 별도 처리가 필요 없음

  # ── Spring Boot 백엔드: 외부(호스트)에는 포트를 열지 않음 ──────────
  # 프론트 Nginx가 도커 내부 네트워크(linktree-network)로 backend:8080에
  # 직접 프록시하므로, 인터넷에 노출할 필요가 없음 (공격 표면 축소)
  backend:
    # !reset: 기존 "8081:8080" 호스트 포트 매핑을 지움 (완전 비공개)
    ports: !reset []
    # 전용 인스턴스로 옮겼지만, 컨테이너 하나가 메모리를 과점해서 db/frontend까지
    # 함께 죽는 걸 막기 위해 상한은 그대로 유지 (t3.small 기준 안전한 값)
    mem_limit: 448m
    environment:
      # SecurityConfig의 CORS 허용 Origin — 실제 프론트 접속 URL과 정확히 일치해야 함
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # JVM 기본값은 힙을 컨테이너 메모리의 25%까지 잡으려 하고, 여기에 메타스페이스/
      # 스레드 스택까지 더해지면 mem_limit(448m)을 넘겨 OOMKilled가 날 수 있음 →
      # 힙 상한을 명시적으로 좁혀 전체 RSS를 mem_limit 안에 들어오게 함
      # (JAVA_TOOL_OPTIONS는 JVM이 기동 시 자동으로 읽는 표준 환경변수라
      #  Dockerfile의 ENTRYPOINT를 안 건드려도 적용됨)
      JAVA_TOOL_OPTIONS: "-Xmx320m -Xss512k"

  # ── MySQL: 127.0.0.1(localhost)에만 바인딩 ──────────────────────
  # SSH 터널(ssh -L)로만 접속 가능, 인터넷에는 노출되지 않음
  # (GUI 툴 - DBeaver/MySQL Workbench 등 - 로 조회하기 위한 용도)
  db:
    # !override: 기존 "3307:3306" 매핑을 "127.0.0.1:포트:3306"으로 완전히 대체
    # 0.0.0.0(전체 인터페이스)으로 열면 안 됨 — 반드시 127.0.0.1로 로컬호스트에만 바인딩
    # (보안그룹을 안 열어도, 호스트 방화벽만 뚫리면 그대로 노출되므로 이중 안전장치)
    ports: !override
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    # 마찬가지로 메모리 상한 + 커넥션 수 상한 (앱 인스턴스 1개만 붙으므로 기본 151개는 과함)
    # 320m은 MySQL 8.0 임시 서버 기동 단계에서 죽기에 충분히 낮은 값이었음
    # ("Unable to determine if daemon is running" 에러로 재현됨) → 512m으로 상향
    mem_limit: 512m
    command: --innodb-buffer-pool-size=128M --max-connections=50

  # ── Let's Encrypt 인증서 자동 갱신 ────────────────────────────
  # 최초 발급은 init-letsencrypt.sh를 한 번 실행해서 처리 (닭-달걀 문제 때문에
  # docker compose up만으로는 최초 발급이 안 됨 — 스크립트 상단 설명 참고)
  certbot:
    image: certbot/certbot
    container_name: linktree-certbot
    mem_limit: 64m
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # 12시간마다 갱신 시도 — 인증서 만료 30일 이내가 아니면 certbot이 알아서 스킵하므로
    # 자주 돌려도 Let's Encrypt 요청 한도에 안 걸림
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"

volumes:
  # 인증서(개인키 포함) 저장용 — frontend(읽기전용)와 certbot(쓰기)이 공유
  certbot-etc:
  # ACME HTTP-01 검증 파일 공유용
  certbot-webroot:
